<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABULA Registration - Join the Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Corrected Link -->
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-left">
            <div class="stars-container"></div>
            <div class="auth-content">
                <h1 class="auth-title">Join the Universe</h1>
                <p class="auth-subtitle">Start your journey through the stars</p>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-form-wrapper">
                <div class="logo">NABULA<span class="logo-glow">™</span></div>
                
                <h2 class="form-title">Register</h2>
                
                <p class="form-description">
                    Register with your Discord account or create a new one to get access to your servers and settings.
                </p>
                
                <button class="discord-login">
                    <span>🔥</span>
                    Register with Discord
                </button>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <form class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Your Username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="your@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="submit-button">
                        Create Account
                    </button>
                </form>
                
                <p class="signup-link">
                    Already have an account? <a href="index.html">Login now</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
